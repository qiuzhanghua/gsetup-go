name: CI

# 每次进 main 与每个 PR 走一遍 vet + test。三个平台各自原生跑（Wails 是 CGO +
# 系统 webview，Windows 那套 webview2、Linux 那套 webkit2gtk 都得真在那儿才编得过）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Linux 上 Wails 的那几个包是 cgo + pkg-config，编不过就是缺头文件。
      - name: 装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # 运行时两套都在，但发版走 GTK3（4.1）兼容老发行版，所以 Linux 上带 gtk3。
      # 注意这一条对 vet 也成立：vet 一样要把每个包编出来。
      - name: 决定要不要带 gtk3
        id: tags
        shell: bash
        run: |
          tags=""
          if [ "${{ runner.os }}" = "Linux" ]; then tags="-tags gtk3"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: go vet
        run: go vet ${{ steps.tags.outputs.tags }} ./...

      # -v：那几条 pty 用例是按平台跳过的（Windows 上跑不了 #!/bin/sh，那一支
      # 换成真的 cmd.exe），不带 -v 就分不清"跳过了"和"真跑过"。
      - name: go test
        run: go test -v ${{ steps.tags.outputs.tags }} ./...
