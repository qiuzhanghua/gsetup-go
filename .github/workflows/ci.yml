name: CI

# 每次进 main 与每个 PR 走一遍 vet + test。三个平台各自原生跑（Wails 是 CGO +
# 系统 webview，Windows 那套 webview2、Linux 那套 webkit2gtk 都得真在那儿才编得过）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Linux 上 Wails 的那几个包是 cgo + pkg-config，编不过就是缺头文件。
      - name: 装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # 默认发版走 GTK4（webkitgtk-6.0）；GTK3/4.1 只是兼容老发行版的可选构建，
      # 所以这里不再加 gtk3 tag。沙箱问题由程序启动时自己探测处理。

      - name: go vet
        run: go vet ./...

      # -v：那几条 pty 用例是按平台跳过的（Windows 上跑不了 #!/bin/sh，那一支
      # 换成真的 cmd.exe），不带 -v 就分不清"跳过了"和"真跑过"。
      - name: go test
        run: go test -v ./...
