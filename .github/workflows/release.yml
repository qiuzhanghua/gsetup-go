name: Release

# 打 tag 就发版；也可以在 Actions 页面手动指定 tag。
# 产物命名（与 gpm-go 那边一个路子，供 ai-desk 之类的打包方取用）：
#   GUI-Setup-<版本>-darwin-<arch>.zip    里面是 GUI-Setup.app
#   GUI-Setup-<版本>-windows-<arch>.exe
#   GUI-Setup-<版本>-linux-<arch>
#
# 与 gpm-go 的 release.yml 有一处必然的不同：gpm 是纯 Go（CGO_ENABLED=0），一个
# ubuntu runner 能编六个平台；GUI-Setup 是 Wails = Go + 系统 webview，必须 CGO，
# 所以六个平台各自原生编一份，每条矩阵腿都有自己的 runner。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（例如 v1.0.0）
        required: true

permissions:
  contents: read

jobs:
  build:
    name: 编译 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         goos: darwin,  goarch: arm64 }
          - { os: macos-26-intel,   goos: darwin,  goarch: amd64 }
          - { os: ubuntu-latest,    goos: linux,   goarch: amd64 }
          - { os: ubuntu-24.04-arm, goos: linux,   goarch: arm64 }
          - { os: windows-latest,   goos: windows, goarch: amd64 }
          - { os: windows-11-arm,   goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 徽标 / 关于里的版本号来自 build/config.yml 的 info.version（v3 会把它
      # 写进 Info.plist 与 Windows 资源）。发版的规矩：先把这个号抬好、提交，再打
      # tag。这里对一下，免得发出一个 tag 说 v1.2.0、程序却自报 1.1.0 的包。
      - name: 算出版本号，并核对 build/config.yml
        id: ver
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # 行尾可能跟着注释（version: "2.0.0" # ...），只取引号里的内容。
          declared=$(sed -n 's/^  version: "\([^"]*\)".*/\1/p' build/config.yml | head -1)
          echo "tag=$tag，版本=$version，build/config.yml 里写着 ${declared:-（没读到）}"
          if [ "$declared" != "$version" ]; then
            echo "::error::build/config.yml 的 info.version 是「$declared」，tag 却是「$tag」——先把版本号抬上去再打 tag。"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Wails 在 Linux 上要的是 webkit2gtk 的头文件，不是可选项。
      - name: 装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 装 wails3
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 编 GUI-Setup
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          wails3 build
          # macOS 的 .app 由 package 任务组装（build 只出裸二进制）。
          if [ "$RUNNER_OS" = "macOS" ]; then wails3 package; fi
          # Linux 额外出一份 GTK3/webkit2gtk-4.1 构建：AI Desk 本体只要 4.1，
          # 而老发行版没有 GTK4 的 webkitgtk-6.0，双击安装器会缺库。
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp bin/GUI-Setup /tmp/GUI-Setup-gtk4
            wails3 build -tags gtk3
            mkdir -p dist
            cp bin/GUI-Setup "dist/GUI-Setup-${VERSION}-linux-${{ matrix.goarch }}-gtk3"
            cp /tmp/GUI-Setup-gtk4 bin/GUI-Setup
          fi
          ls -l bin

      - name: 打包产物
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          case "${{ matrix.goos }}" in
            darwin)
              out="GUI-Setup-${VERSION}-darwin-${{ matrix.goarch }}.zip"
              # ditto 是 macOS 自带的，比 zip 更懂 .app（符号链接、x 位、资源叉）。
              ditto -c -k --sequesterRsrc --keepParent bin/GUI-Setup.app "dist/$out"
              unzip -l "dist/$out" | head -5
              ;;
            windows)
              out="GUI-Setup-${VERSION}-windows-${{ matrix.goarch }}.exe"
              cp bin/GUI-Setup.exe "dist/$out"
              ;;
            linux)
              out="GUI-Setup-${VERSION}-linux-${{ matrix.goarch }}"
              cp bin/GUI-Setup "dist/$out"
              chmod +x "dist/$out"
              ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: GUI-Setup-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 发 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 建 Release 并传产物
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
